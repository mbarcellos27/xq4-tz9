name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Liberar espaço no runner
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker system prune -af
          df -h /

      - uses: actions/checkout@v4

      - name: Nome da imagem
        id: img
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/xq4-tz9" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # sem setup-buildx: driver docker padrão, a imagem fica no daemon local para o smoke
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          sbom: false
          build-args: |
            GIT_SHA=${{ github.sha }}
            APP_REPO=${{ vars.APP_REPO }}
            NODE_REPO=${{ vars.NODE_REPO }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.title=xq4-tz9
            org.opencontainers.image.description=
            org.opencontainers.image.url=
            org.opencontainers.image.documentation=
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:${{ steps.img.outputs.sha }}

      - name: Smoke (CPU)
        run: docker run --rm -e SMOKE=1 ${{ steps.img.outputs.name }}:${{ steps.img.outputs.sha }}

      - name: Tamanho da imagem
        if: always()
        run: |
          docker image inspect ${{ steps.img.outputs.name }}:${{ steps.img.outputs.sha }} --format '{{.Size}}' | awk '{printf "imagem (descomprimida): %.2f GB\n", $1/1e9}'
          df -h /
